<circle cx="24" cy="20" r="6" fill="#ff5f56"/><circle cx="46" cy="20" r="6" fill="#ffbd2e"/><circle cx="68" cy="20" r="6" fill="#27c93f"/>
<text x="450.0" y="25" text-anchor="middle" font-size="13" fill="#8b949e" style="font-size:13px">bash — PixelMarketplace-aspnetcore</text>
<text x="28" y="72" fill="#39ff14" opacity="0">$<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.0375;0.0406;1.0000" dur="16s" repeatCount="indefinite"/></text>
<text x="46" y="72" fill="#e6edf3" textLength="639" lengthAdjust="spacing" clip-path="url(#c0)">git clone https://github.com/MIhajloS07/PixelMarketplace-aspnetcore.git</text>
<text x="28" y="98" fill="#39ff14" opacity="0">$<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.1938;0.1969;1.0000" dur="16s" repeatCount="indefinite"/></text>
<text x="46" y="98" fill="#e6edf3" textLength="270" lengthAdjust="spacing" clip-path="url(#c1)">cd PixelMarketplace-aspnetcore</text>
<text x="28" y="124" fill="#39ff14" opacity="0">$<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.2625;0.2656;1.0000" dur="16s" repeatCount="indefinite"/></text>
<text x="46" y="124" fill="#e6edf3" textLength="126" lengthAdjust="spacing" clip-path="url(#c2)">dotnet restore</text>
<text x="46" y="150" fill="#8b949e" opacity="0">Restore complete.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.3125;0.3156;1.0000" dur="16s" repeatCount="indefinite"/></text>
<text x="28" y="176" fill="#39ff14" opacity="0">$<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.3625;0.3656;1.0000" dur="16s" repeatCount="indefinite"/></text>
<text x="46" y="176" fill="#e6edf3" textLength="225" lengthAdjust="spacing" clip-path="url(#c4)">dotnet ef database update</text>
<text x="46" y="202" fill="#39ff14" opacity="0">Applying migrations and seeding demo data ... Done.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.4375;0.4406;1.0000" dur="16s" repeatCount="indefinite"/></text>
<text x="28" y="228" fill="#39ff14" opacity="0">$<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.5000;0.5031;1.0000" dur="16s" repeatCount="indefinite"/></text>
<text x="46" y="228" fill="#e6edf3" textLength="90" lengthAdjust="spacing" clip-path="url(#c6)">dotnet run</text>
<text x="46" y="254" fill="#00f5ff" opacity="0">Now listening on: https://localhost:5001<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.5500;0.5531;1.0000" dur="16s" repeatCount="indefinite"/></text>
<text x="46" y="280" fill="#8b949e" opacity="0">Application started. Press Ctrl+C to shut down.<animate attributeName="opacity" values="0;0;1;1" keyTimes="0.0000;0.5750;0.5781;1.0000" dur="16s" repeatCount="indefinite"/></text>
