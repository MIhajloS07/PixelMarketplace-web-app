<clipPath id="c2"><rect x="46" y="106" height="26" width="0"><animate attributeName="width" values="0;0;128;128" keyTimes="0;0.2625;0.3000;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="c4"><rect x="46" y="158" height="26" width="0"><animate attributeName="width" values="0;0;227;227" keyTimes="0;0.3625;0.4250;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
<clipPath id="c6"><rect x="46" y="210" height="26" width="0"><animate attributeName="width" values="0;0;92;92" keyTimes="0;0.5000;0.5375;1" dur="16s" repeatCount="indefinite"/></rect></clipPath>
